name: ArogyaMitra CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'ArogyaMitra-main/Backend/**'
      - 'ArogyaMitra-main/WebFrontend/**'
      - 'ArogyaMitra-main/deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: arogyamitra-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ArogyaMitra-main/Backend/package-lock.json
            ArogyaMitra-main/WebFrontend/package-lock.json

      - name: Backend - install
        working-directory: ArogyaMitra-main/Backend
        run: npm ci --no-audit --no-fund

      - name: Backend - syntax check all source files
        working-directory: ArogyaMitra-main/Backend
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Web portal - install & build
        working-directory: ArogyaMitra-main/WebFrontend
        run: |
          npm ci --no-audit --no-fund
          VITE_API_BASE_URL=/api npm run build

  deploy:
    name: Deploy to EC2 (SSM)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC - no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: arogyamitra-deploy-${{ github.run_id }}

      - name: Run deploy script on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ArogyaMitra deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters 'commands=["sudo -iu ssm-user bash /home/ssm-user/ArogyaMitra-V/ArogyaMitra-main/deploy/deploy.sh"],executionTimeout=["900"]' \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          STATUS="Pending"
          for i in $(seq 1 180); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          echo "===== Server output ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== Server errors ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]
